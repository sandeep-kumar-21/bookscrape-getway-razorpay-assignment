services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bookscrape-gateway
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - PORT=3000
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - REDIS_DB=0
      - KEY_PREFIX=bsg:v1:
      - SOURCE_BASE_URL=https://books.toscrape.com
      - USER_AGENT=bookscrape-gateway/1.0 (+https://github.com/assignment/bookscrape-gateway)
      - HTTP_TIMEOUT_MS=10000
      - HTTP_MAX_RETRIES=3
      - HTTP_CONCURRENCY=2
      - HTTP_DELAY_MS=300
      - DETAIL_TTL_SECONDS=604800
      - SNAPSHOT_TTL_SECONDS=60
      - SYNC_LOCK_TTL_SECONDS=900
      - AUTO_SYNC_ON_BOOT=true
      - THROTTLE_TTL=60
      - THROTTLE_LIMIT=100
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000/api/v1/health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis_data:
    name: redis_data
